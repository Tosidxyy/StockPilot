[project]
name = "stockpilot-backend"
version = "0.2.0"
description = "StockPilot API"
requires-python = ">=3.13"
dependencies = [
    "cachetools>=7.2.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-ai-slim[openai]>=2.50.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "sqlalchemy>=2.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pydantic-evals>=2.50.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp"
